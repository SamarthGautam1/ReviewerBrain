# ReviewerBrain — frozen RAG configuration (validated 2026-09-13).
# Scripts keep identical constants in code; tests assert this file and the
# code stay in sync. Changing values here does NOT change script behavior.
embedding:
  model: all-MiniLM-L6-v2
  dimensions: 384
  max_seq_tokens: 256
  device: cpu

representation:
  format: comment-first
  template: "Reviewer comment:\\n{comment}\\n\\nFile:\\n{file}\\n\\nRelevant diff:\\n{trimmed_diff}"
  min_diff_tokens: 24
  safety_margin: 2
  anchor: comment_line_nearest

retrieval:
  serving_indexes: per_reviewer
  top_k: 3
  gate:
    metric: cosine
    min: 0.5

indexes:
  backend: chromadb
  space: cosine
  path: indexes/chroma/v2
  collections: [thockin, ezyang, combined]

evaluation:
  split:
    rule: per-reviewer sorted unique pr_number, every Nth held out
    period: 5
    held_position: 4
  thresholds:
    cosine: 0.5
    fidelity: 0.25   # equivalent: cos >= 0.5  <=>  cos^2 >= 0.25
  k_values: [1, 3, 5]
  heldout_artifact: evaluations/heldout/eval_heldout_queries.jsonl

data:
  raw_dir: data/raw
  processed_dir: data/processed
  reviewers:
    - name: thockin
      repo: kubernetes/kubernetes
      raw: thockin_kubernetes_training.jsonl
    - name: ezyang
      repo: pytorch/pytorch
      raw: ezyang_pytorch_training.jsonl
